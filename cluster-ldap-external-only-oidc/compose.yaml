      KAFKA_CONFLUENT_LICENSE_SASL_MECHANISM: PLAIN
      #KAFKA_CONFLUENT_LICENSE_SASL_LOGIN_CALLBACK_HANDLER_CLASS: 'org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginCallbackHandler'
      KAFKA_CONFLUENT_LICENSE_SASL_LOGIN_CALLBACK_HANDLER_CLASS: io.confluent.kafka.clients.plugins.auth.token.TokenUserLoginCallbackHandler
