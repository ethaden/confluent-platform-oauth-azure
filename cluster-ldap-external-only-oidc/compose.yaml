services:

  openldap:
    image: osixia/openldap:1.5.0
    container_name: openldap
    hostname: openldap
    ports:
      - "389:389"
      - "636:636"
    volumes:
      - openldap-data:/var/lib/ldap
      - openldap-config:/etc/ldap/slapd.conf.d
    healthcheck:
      test: bash -c "exec 6<> /dev/tcp/localhost/389"
    environment:
      LDAP_ORGANISATION: "Confluent-Demo"
      LDAP_DOMAIN: "${LDAP_DOMAIN}"
      LDAP_BASE_DN: "${LDAP_BASE_DN}"
      LDAP_ADMIN_PASSWORD: "${LDAP_ADMIN_PASSWORD}"
      LDAP_READONLY_USER_USERNAME: "${LDAP_READONLY_USER_USERNAME}"
      LDAP_READONLY_USER_PASSWORD: "${LDAP_READONLY_USER_PASSWORD}"
      LDAP_RFC2307BIS_SCHEMA: "true"
      #LDAP_SEED_INTERNAL_LDIF_PATH: "${CI_PROJECT_DIR}/docker/openldap/ldif"
      #LDAP_SEED_INTERNAL_SCHEMA_PATH: "${CI_PROJECT_DIR}/docker/openldap/schema"

  init_openldap:
    image: osixia/openldap:1.5.0
    container_name: init_openldap
    depends_on:
      openldap:
        condition: service_healthy
    entrypoint: /bin/sh
    volumes:
      - ./helper/init_openldap.sh:/usr/bin/init_openldap.sh
      - ./keys:/keys
      - ./templates:/te
    command: "/usr/bin/init_openldap.sh openldap \"${LDAP_DOMAIN}\" \"${LDAP_BASE_DN}\" \"${LDAP_ADMIN_PASSWORD}\""
    environment:
      LDAP_ADMIN_PASSWORD: "${LDAP_ADMIN_PASSWORD}"
      LDAP_BASE_DN: "${LDAP_BASE_DN}"
      LDAP_DOMAIN: "${LDAP_DOMAIN}"
    deploy: 
      restart_policy: 
        condition: none

  init_certificates:
    image: ${DOCKER_REGISTRY}confluentinc/cp-server:${CONFLUENT_DOCKER_TAG:-latest}
    container_name: init_certificates
    volumes:
      - ./helper/init_certificates.sh:/usr/bin/init_certificates.sh
      - ./keys:/keys
      - ./templates:/templates
      - ./mount:/mount
    entrypoint: /bin/sh
    command: "/usr/bin/init_certificates.sh ${TRUSTSTORE_PASSWORD}"
    environment:
      TRUSTSTORE_PASSWORD: ${TRUSTSTORE_PASSWORD}
      IDP_TOKEN_ENDPOINT: ${IDP_TOKEN_ENDPOINT}
      SUPERUSER_CLIENT_ID: ${SUPERUSER_CLIENT_ID}
      SUPERUSER_CLIENT_SECRET: ${SUPERUSER_CLIENT_SECRET}
      CLIENT_APP_ID: ${CLIENT_APP_ID}
      CLIENT_APP_SECRET: ${CLIENT_APP_SECRET}
      AZURE_OAUTH_SCOPE: ${AZURE_OAUTH_SCOPE}
    deploy: 
      restart_policy: 
        condition: none

  broker1:
    image: ${DOCKER_REGISTRY}confluentinc/cp-server:${CONFLUENT_DOCKER_TAG:-latest}
    hostname: broker1
    container_name: broker1
    depends_on:
      init_certificates:
        condition: service_completed_successfully
      init_openldap:
        condition: service_completed_successfully
    healthcheck:
      test: curl -fail --silent --insecure http://broker1:8090/v1/metadata/id || exit 1
      interval: 10s
      retries: 5
      start_period: 20s
    ports:
      - "9092:9092" # KAFKA PLAINTEXT
      - "8090:8090" # MDS
      - "9095:9095" # KAFKA with OAUTHBEARER
      - "9096:9096" # MDS Token Issuer for exchanging IdP tokens or username+password for MDS-issued tokens
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:SASL_PLAINTEXT,INTERNAL:SASL_PLAINTEXT,EXTERNALOAUTH:SASL_PLAINTEXT,TOKEN:SASL_PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://broker1:9092,CONTROLLER://broker1:9192,INTERNAL://broker1:9093,EXTERNALOAUTH://broker1:9095,TOKEN://broker1:9096
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker1:9092,INTERNAL://broker1:9093,EXTERNALOAUTH://broker1:9095,TOKEN://broker1:9096
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@broker1:9192'
      #,2@broker2:9192,3@broker3:9192'
      KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL: PLAIN
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: ${CLUSTER_ID}
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_SUPER_USERS: User:admin;User:$SUPERUSER_PRINCIPAL_ID
      KAFKA_LOG4J_ROOT_LOGLEVEL: INFO
      KAFKA_LOG4J_LOGGERS: "kafka.authorizer.logger=INFO,io.confluent.rest-utils=DEBUG,io.confluent.rbacapi=INFO,io.confluent.tokenapi=INFO,io.confluent.security.auth=INFO,io.confluent.security.store=INFO,io.confluent.common.security.jetty=INFO"
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN, OAUTHBEARER
      KAFKA_OPTS: '-Dorg.apache.kafka.sasl.oauthbearer.allowed.urls=$IDP_TOKEN_ENDPOINT,$IDP_JWKS_ENDPOINT,$IDP_AUTHORIZATION_ENDPOINT,$IDP_DEVICE_AUTHORIZATION_ENDPOINT'

      # For Port 9092, we support just username+password authentication
      KAFKA_LISTENER_NAME_PLAINTEXT_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_LISTENER_NAME_PLAINTEXT_PLAIN_SASL_JAAS_CONFIG: |
        org.apache.kafka.common.security.plain.PlainLoginModule required \
        username="admin" \
        password="admin-secret" \
        user_admin="admin-secret" \
        user_client="client-secret";

      # For inter-broker communication on Port 9093, we support just username+password authentication
      KAFKA_LISTENER_NAME_INTERNAL_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_LISTENER_NAME_INTERNAL_PLAIN_SASL_JAAS_CONFIG: |
        org.apache.kafka.common.security.plain.PlainLoginModule required \
        username="admin" \
        password="admin-secret" \
        user_admin="admin-secret" \
        user_mds="mds-secret";

      # For controller communication on Port 9192, we support just username+password authentication
      KAFKA_LISTENER_NAME_CONTROLLER_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_LISTENER_NAME_CONTROLLER_PLAIN_SASL_JAAS_CONFIG: |
        org.apache.kafka.common.security.plain.PlainLoginModule required \
        username="admin" \
        password="admin-secret" \
        user_admin="admin-secret" \
        user_mds="mds-secret";

      ############################# Token Listener Settings #############################
      # This is used by MDS and allows providing either an IdP token or username+password in order to get a token back which is issued by the MDS token issuer service
      #KAFKA_LISTENER_NAME_TOKEN_SASL_ENABLED_MECHANISMS: OAUTHBEARER,PLAIN
      KAFKA_LISTENER_NAME_TOKEN_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_LISTENER_NAME_TOKEN_SASL_SERVER_CALLBACK_HANDLER_CLASS: io.confluent.kafka.server.plugins.auth.token.TokenBearerServerLoginCallbackHandler
      KAFKA_LISTENER_NAME_TOKEN_OAUTHBEARER_SASL_SERVER_CALLBACK_HANDLER_CLASS: io.confluent.kafka.server.plugins.auth.token.TokenBearerValidatorCallbackHandler
      KAFKA_LISTENER_NAME_TOKEN_PLAIN_SASL_JAAS_CONFIG: |
        org.apache.kafka.common.security.plain.PlainLoginModule required \
        username="admin" \
        password="admin-secret" \
        user_admin="admin-secret" \
        user_mds="mds-secret";
      #listener.name.token.oauthbearer.sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required publicKeyPath="/var/ssl/private/public.pem";
      #listener.name.token.oauthbearer.sasl.login.callback.handler.class=io.confluent.kafka.server.plugins.auth.token.TokenBearerServerLoginCallbackHandler
      #listener.name.token.oauthbearer.sasl.server.callback.handler.class=io.confluent.kafka.server.plugins.auth.token.TokenBearerValidatorCallbackHandler
      #listener.name.token.principal.builder.class=io.confluent.kafka.security.authenticator.OAuthKafkaPrincipalBuilder
      #listener.name.token.sasl.enabled.mechanisms=OAUTHBEARER

      # Configure OAuth Token listener for external tokens (from IdP)
      KAFKA_LISTENER_NAME_EXTERNALOAUTH_SASL_ENABLED_MECHANISMS: OAUTHBEARER
      KAFKA_LISTENER_NAME_EXTERNALOAUTH_OAUTHBEARER_SASL_SERVER_CALLBACK_HANDLER_CLASS: io.confluent.kafka.server.plugins.auth.token.CompositeBearerValidatorCallbackHandler
      KAFKA_LISTENER_NAME_EXTERNALOAUTH_PRINCIPAL_BUILDER_CLASS: io.confluent.kafka.security.authenticator.OAuthKafkaPrincipalBuilder
      KAFKA_LISTENER_NAME_EXTERNALOAUTH_SASL_OAUTHBEARER_JWKS_ENDPOINT_URL: ${IDP_JWKS_ENDPOINT}
      KAFKA_LISTENER_NAME_EXTERNALOAUTH_SASL_OAUTHBEARER_EXPECTED_AUDIENCE: ${EXPECTED_AUDIENCE}
      KAFKA_LISTENER_NAME_EXTERNALOAUTH_SASL_OAUTHBEARER_SUB_CLAIM_NAME: ${SUB_CLAIM_NAME}
      KAFKA_LISTENER_NAME_EXTERNALOAUTH_OAUTHBEARER_GROUPS_CLAIM_NAME: ${GROUP_CLAIM_NAME}
      KAFKA_CONFLUENT_OAUTH_GROUPS_CLAIM_NAME: ${GROUP_CLAIM_NAME}
      # Note: the 'unsecuredLoginStringClaim_sub="thePrincipalName"' is currently required for listeners when using RBAC in Confluent Platform for handling MDS-issued tokens.
      # It might be removed in future versions.
      # Explanation: The following JAAS configuration is used only for the listener that accepts OAUTHBEARER tokens from external clients to Kafka brokers.
      # Therefore, we do not need clientId and clientSecret of the Confluent Platform Application Registration here, as only the external clients need them for authenticating to EntraID.
      # This listener just needs to be able to validate the access tokens presented by the external clients (issued by EntraID). 
      KAFKA_LISTENER_NAME_EXTERNALOAUTH_OAUTHBEARER_SASL_JAAS_CONFIG: |
        org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required \
        unsecuredLoginStringClaim_sub="thePrincipalName" \
        publicKeyPath="/keys/public.pem" \
        scope="${AZURE_OAUTH_SCOPE}";

      # Configure Confluent Server Authorizer
      KAFKA_AUTHORIZER_CLASS_NAME: io.confluent.kafka.security.authorizer.ConfluentServerAuthorizer
      KAFKA_CONFLUENT_AUTHORIZER_ACCESS_RULE_PROVIDERS: CONFLUENT,KRAFT_ACL

      # MDS (server configuration)
      KAFKA_CONFLUENT_METADATA_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CONFLUENT_METADATA_SERVER_AUTHENTICATION_METHOD: BEARER
      KAFKA_CONFLUENT_METADATA_SERVER_LISTENERS: http://0.0.0.0:8090
      KAFKA_CONFLUENT_METADATA_SERVER_ADVERTISED_LISTENERS: http://broker1:8090
      KAFKA_CONFLUENT_METADATA_SERVER_TOKEN_KEY_PATH: /keys/keypair.pem
      KAFKA_CONFLUENT_METADATA_SERVER_OPENAPI_ENABLE: 'true'
      # Use MDS without LDAP, OAuth token is required
      KAFKA_CONFLUENT_METADATA_SERVER_USER_STORE: LDAP_WITH_OAUTH
      KAFKA_CONFLUENT_METADATA_SERVER_OAUTHBEARER_JWKS_ENDPOINT_URL: ${IDP_JWKS_ENDPOINT}
      KAFKA_CONFLUENT_METADATA_SERVER_OAUTHBEARER_EXPECTED_ISSUER: ${IDP_EXPECTED_ISSUER}
      KAFKA_CONFLUENT_METADATA_SERVER_OAUTHBEARER_EXPECTED_AUDIENCE: ${EXPECTED_AUDIENCE}
      KAFKA_CONFLUENT_METADATA_SERVER_OAUTHBEARER_SUB_CLAIM_NAME: ${SUB_CLAIM_NAME}
      KAFKA_CONFLUENT_METADATA_SERVER_OAUTHBEARER_GROUPS_CLAIM_NAME: ${GROUP_CLAIM_NAME}

      # LDAP
      KAFKA_LDAP_JAVA_NAMING_PROVIDER_URL: ldap://openldap:389/dc=demo,dc=confluent,dc=io
      KAFKA_LDAP_JAVA_NAMING_SECURITY_PRINCIPAL: "cn=admin,dc=demo,dc=confluent,dc=io"
      # Password of user
      KAFKA_LDAP_JAVA_NAMING_SECURITY_CREDENTIALS: "admin"
      KAFKA_LDAP_JAVA_NAMING_SECURITY_AUTHENTICATION: "simple"
      KAFKA_LDAP_SEARCH_MODE: "USERS"
      KAFKA_LDAP_USER_SEARCH_BASE: "ou=users,dc=demo,dc=confluent,dc=io"
      KAFKA_LDAP_USER_SEARCH_SCOPE: 2
      KAFKA_LDAP_USER_OBJECT_CLASS: "user"
      KAFKA_LDAP_USER_SEARCH_FILTER: "(memberOf=cn=kafka,ou=groups,dc=demo,dc=confluent,dc=io)"

      # The following should only be required when configuring a secondary cluster which is supposed to access another MDS cluster (hosted by the primary cluster)
      #KAFKA_CONFLUENT_METADATA_SECURITY_PROTOCOL: SASL_PLAINTEXT
      #KAFKA_CONFLUENT_METADATA_SASL_MECHANISM: OAUTHBEARER
      #KAFKA_CONFLUENT_METADATA_SASL_LOGIN_CALLBACK_HANDLER_CLASS: 'org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginCallbackHandler'
      #KAFKA_CONFLUENT_METADATA_SASL_OAUTHBEARER_TOKEN_ENDPOINT_URL: ${IDP_TOKEN_ENDPOINT}
      #KAFKA_CONFLUENT_METADATA_SASL_JAAS_CONFIG: |
      #  org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required \
      #  clientId="${RP_CLIENT_ID}" \
      #  clientSecret="${RP_CLIENT_SECRET}" \
      #  scope="${AZURE_OAUTH_SCOPE}";

      # EmbeddedKafkaRest: Kafka Client Configuration (ONLY REQUIRED FOR STANDALONE REST PROXY)
      #KAFKA_KAFKA_CLIENT_BOOTSTRAP_SERVERS: SASL_PLAINTEXT://broker1:9092
      #KAFKA_CLIENT_SASL_MECHANISM: OAUTHBEARER
      #KAFKA_CLIENT_SECURITY_PROTOCOL: SASL_PLAINTEXT
      #KAFKA_CLIENT_SASL_LOGIN_CALLBACK_HANDLER_CLASS: 'org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginCallbackHandler'
      #KAFKA_CLIENT_SASL_OAUTHBEARER_TOKEN_ENDPOINT_URL: ${IDP_TOKEN_ENDPOINT}
      #KAFKA_CLIENT_SASL_JAAS_CONFIG: |
      #  org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required \
      #  clientId="${AZURE_CP_APPLICATION_ID}" \
      #  clientSecret="${AZURE_CP_APPLICATION_SECRET}" \
      #  scope="${AZURE_OAUTH_SCOPE}";

      # EmbeddedKafkaRest: Tries to authenticate a client by Confluent-MDS-issued bearer token first, then IdP-issued token, finally by HTTP Basic Auth
      # The JAAS configuration is required just for the HTTP Basic Auth fallback mechanism to work.
      KAFKA_KAFKA_REST_BOOTSTRAP_SERVERS: EXTERNALOAUTH://broker1:9095
      KAFKA_KAFKA_REST_KAFKA_REST_RESOURCE_EXTENSION_CLASS: io.confluent.kafkarest.security.KafkaRestSecurityResourceExtension
      # See https://docs.confluent.io/platform/current/security/authentication/multi-protocol/authenticationhandler.html
      KAFKA_KAFKA_REST_REST_SERVLET_INITIALIZOR_CLASSES: io.confluent.common.security.jetty.initializer.AuthenticationHandler
      KAFKA_KAFKA_REST_AUTHENTICATION_ROLES: "**"
      KAFKA_KAFKA_REST_OAUTHBEARER_JWKS_ENDPOINT_URL: ${IDP_JWKS_ENDPOINT}
      KAFKA_KAFKA_REST_OAUTHBEARER_EXPECTED_ISSUER: ${IDP_EXPECTED_ISSUER}
      KAFKA_KAFKA_REST_OAUTHBEARER_EXPECTED_AUDIENCE: ${EXPECTED_AUDIENCE}
      KAFKA_KAFKA_REST_OAUTHBEARER_SUB_CLAIM_NAME: ${SUB_CLAIM_NAME}
      KAFKA_KAFKA_REST_OAUTHBEARER_GROUPS_CLAIM_NAME: ${GROUP_CLAIM_NAME}
      KAFKA_KAFKA_REST_PUBLIC_KEY_PATH: /keys/public.pem
      KAFKA_KAFKA_REST_BASIC_AUTH_USER_INFO: admin:admin,mds:mds,client:client

      # EmbeddedKafkaRest: MDS Client configuration
      KAFKA_KAFKA_REST_CONFLUENT_METADATA_BOOTSTRAP_SERVER_URLS: http://broker1:8090
      KAFKA_KAFKA_REST_CONFLUENT_METADATA_HTTP_AUTH_CREDENTIALS_PROVIDER: OAUTHBEARER
      KAFKA_KAFKA_REST_CONFLUENT_METADATA_OAUTHBEARER_TOKEN_ENDPOINT_URL: ${IDP_TOKEN_ENDPOINT}
      KAFKA_KAFKA_REST_CONFLUENT_METADATA_OAUTHBEARER_LOGIN_CLIENT_ID: ${RP_CLIENT_ID}
      KAFKA_KAFKA_REST_CONFLUENT_METADATA_OAUTHBEARER_LOGIN_CLIENT_SECRET: ${RP_CLIENT_SECRET}
      KAFKA_KAFKA_REST_CONFLUENT_METADATA_OAUTHBEARER_LOGIN_OAUTH_SCOPE: ${AZURE_OAUTH_SCOPE}
      KAFKA_KAFKA_REST_CONFLUENT_METADATA_SERVER_URLS_MAX_AGE_MS: 60000
      KAFKA_KAFKA_REST_CLIENT_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_KAFKA_REST_CLIENT_SASL_LOGIN_CALLBACK_HANDLER_CLASS: 'org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginCallbackHandler'
      KAFKA_KAFKA_REST_CLIENT_SASL_OAUTHBEARER_TOKEN_ENDPOINT_URL: ${IDP_TOKEN_ENDPOINT}
      KAFKA_KAFKA_REST_CLIENT_SASL_JAAS_CONFIG: |
        org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required \
        clientId="${AZURE_CP_APPLICATION_ID}" \
        clientSecret="${AZURE_CP_APPLICATION_SECRET}" \
        scope="${AZURE_OAUTH_SCOPE}";
      KAFKA_KAFKA_REST_CLIENT_CONFLUENT_METADATA_SERVER_URLS_MAX_AGE_MS: 60000

      # Enable SSO for Control Center
      KAFKA_CONFLUENT_METADATA_SERVER_SSO_MODE: oidc
      KAFKA_CONFLUENT_OIDC_IDP_ISSUER: ${IDP_EXPECTED_ISSUER}
      KAFKA_CONFLUENT_OIDC_IDP_JWKS_ENDPOINT_URI: ${IDP_JWKS_ENDPOINT}
      KAFKA_CONFLUENT_OIDC_IDP_AUTHORIZE_BASE_ENDPOINT_URI: ${IDP_AUTHORIZATION_ENDPOINT}
      KAFKA_CONFLUENT_OIDC_IDP_TOKEN_BASE_ENDPOINT_URI: ${IDP_TOKEN_ENDPOINT}
      KAFKA_CONFLUENT_OIDC_IDP_CLIENT_ID: ${SSO_CLIENT_ID}
      KAFKA_CONFLUENT_OIDC_IDP_CLIENT_SECRET: ${SSO_CLIENT_SECRET}
      KAFKA_CONFLUENT_OIDC_IDP_DEVICE_AUTHORIZATION_ENDPOINT_URI: ${IDP_DEVICE_AUTHORIZATION_ENDPOINT}
      KAFKA_CONFLUENT_OIDC_IDP_SUB_CLAIM_NAME: ${SUB_CLAIM_NAME}
      KAFKA_CONFLUENT_OIDC_IDP_GROUPS_CLAIM_NAME: ${GROUP_CLAIM_NAME}
      KAFKA_CONFLUENT_OIDC_IDP_REFRESH_TOKEN_ENABLED: 'true'
      KAFKA_CONFLUENT_OIDC_IDP_JTI_VALIDATION_ENABLED: 'false'

      # Other configurations
      KAFKA_CONFLUENT_CLUSTER_LINK_METADATA_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CONFLUENT_BALANCER_ENABLED: 'false'
      KAFKA_CONFLUENT_TELEMETRY_ENABLED: 'false'
      KAFKA_CONFLUENT_REPORTERS_TELEMETRY_AUTO_ENABLED: 'false'
      KAFKA_LOG_RETENTION_HOURS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLED: 'true'
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CONFLUENT_BALANCER_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CONFLUENT_SECURITY_EVENT_LOGGER_AUTHENTICATION_ENABLE: 'true'
      EXTRA_ARGS: "-javaagent:/usr/bin/jmx/jmx_prometheus_javaagent-0.15.0.jar=1234:/usr/bin/jmx/exporter.yml"

      # C3 Next Gen Metrics
      KAFKA_METRIC_REPORTERS: io.confluent.telemetry.reporter.TelemetryReporter
      KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_TYPE: "http"
      KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_ENABLED: "true"
      KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_METRICS_INCLUDE: "io.confluent.kafka.server.request.(?!.*delta).*|io.confluent.kafka.server.server.broker.state|io.confluent.kafka.server.replica.manager.leader.count|io.confluent.kafka.server.request.queue.size|io.confluent.kafka.server.broker.topic.failed.produce.requests.rate.1.min|io.confluent.kafka.server.tier.archiver.total.lag|io.confluent.kafka.server.request.total.time.ms.p99|io.confluent.kafka.server.broker.topic.failed.fetch.requests.rate.1.min|io.confluent.kafka.server.broker.topic.total.fetch.requests.rate.1.min|io.confluent.kafka.server.partition.caught.up.replicas.count|io.confluent.kafka.server.partition.observer.replicas.count|io.confluent.kafka.server.tier.tasks.num.partitions.in.error|io.confluent.kafka.server.broker.topic.bytes.out.rate.1.min|io.confluent.kafka.server.request.total.time.ms.p95|io.confluent.kafka.server.controller.active.controller.count|io.confluent.kafka.server.request.total.time.ms.p999|io.confluent.kafka.server.controller.active.broker.count|io.confluent.kafka.server.request.handler.pool.request.handler.avg.idle.percent.rate.1.min|io.confluent.kafka.server.controller.unclean.leader.elections.rate.1.min|io.confluent.kafka.server.replica.manager.partition.count|io.confluent.kafka.server.controller.unclean.leader.elections.total|io.confluent.kafka.server.partition.replicas.count|io.confluent.kafka.server.broker.topic.total.produce.requests.rate.1.min|io.confluent.kafka.server.controller.offline.partitions.count|io.confluent.kafka.server.socket.server.network.processor.avg.idle.percent|io.confluent.kafka.server.partition.under.replicated|io.confluent.kafka.server.log.log.start.offset|io.confluent.kafka.server.log.tier.size|io.confluent.kafka.server.log.size|io.confluent.kafka.server.tier.fetcher.bytes.fetched.total|io.confluent.kafka.server.request.total.time.ms.p50|io.confluent.kafka.server.tenant.consumer.lag.offsets|io.confluent.kafka.server.log.log.end.offset|io.confluent.kafka.server.broker.topic.bytes.in.rate.1.min|io.confluent.kafka.server.partition.under.min.isr|io.confluent.kafka.server.partition.in.sync.replicas.count|io.confluent.telemetry.http.exporter.batches.dropped|io.confluent.telemetry.http.exporter.items.total|io.confluent.telemetry.http.exporter.items.succeeded|io.confluent.telemetry.http.exporter.send.time.total.millis|io.confluent.kafka.server.controller.leader.election.rate.(?!.*delta).*|io.confluent.telemetry.http.exporter.batches.failed"
      KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_CLIENT_BASE_URL: "http://c3prometheus:9090/api/v1/otlp"
      KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_CLIENT_COMPRESSION: "gzip"
      KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_API_KEY: "dummy"
      KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_API_SECRET: "dummy"
      KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_BUFFER_PENDING_BATCHES_MAX: "80"
      KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_BUFFER_BATCH_ITEMS_MAX: "4000"
      KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_BUFFER_INFLIGHT_SUBMISSIONS_MAX: "10"
      KAFKA_CONFLUENT_TELEMETRY_METRICS_COLLECTOR_INTERVAL_MS: "60000"
      KAFKA_CONFLUENT_TELEMETRY_REMOTECONFIG_CONFLUENT_ENABLED: "false"
      KAFKA_CONFLUENT_CONSUMER_LAG_EMITTER_ENABLED: "true"

      # LICENSE
